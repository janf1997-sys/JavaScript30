<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JS + CSS Clock</title>
    <link rel="icon" href="https://fav.farm/🔥" />
  </head>
  <body>
    <div class="clock">
      <div class="clock-face">
        <div class="number" style="--i: 1"><span>1</span></div>
        <div class="number" style="--i: 2"><span>2</span></div>
        <div class="number" style="--i: 3"><span>3</span></div>
        <div class="number" style="--i: 4"><span>4</span></div>
        <div class="number" style="--i: 5"><span>5</span></div>
        <div class="number" style="--i: 6"><span>6</span></div>
        <div class="number" style="--i: 7"><span>7</span></div>
        <div class="number" style="--i: 8"><span>8</span></div>
        <div class="number" style="--i: 9"><span>9</span></div>
        <div class="number" style="--i: 10"><span>10</span></div>
        <div class="number" style="--i: 11"><span>11</span></div>
        <div class="number" style="--i: 12"><span>12</span></div>
        <div class="hand hour-hand"></div>
        <div class="hand min-hand"></div>
        <div class="hand second-hand"></div>
      </div>
    </div>

    <style>
      html {
        background: #018ded url(https://unsplash.it/1500/1000?image=881&blur=5);
        background-size: cover;
        font-family: 'helvetica neue';
        text-align: center;
        font-size: 10px;
      }

      body {
        margin: 0;
        font-size: 2rem;
        display: flex;
        flex: 1;
        min-height: 100vh;
        align-items: center;
      }

      .clock {
        width: 30rem;
        height: 30rem;
        border: 20px solid white;
        border-radius: 50%;
        margin: 50px auto;
        position: relative;
        padding: 2rem;
        box-shadow:
          0 0 0 4px rgba(0, 0, 0, 0.1),
          inset 0 0 0 3px #efefef,
          inset 0 0 10px black,
          0 0 10px rgba(0, 0, 0, 0.2);
      }

      .clock-face {
        position: relative;
        width: 100%;
        height: 100%;
        transform: translateY(
          -3px
        ); /* account for the height of the clock hands */
      }

      .hand {
        width: 50%;
        height: 6px;
        background: black;
        position: absolute;
        top: 50%;
        transform-origin: 100%;
        transform: rotate(90deg);
        transition: all 0.05s;
        transition-timing-function: cubic-bezier(0.1, 2.7, 0.58, 1);
      }

      .number {
        position: absolute;
        width: 100%;
        height: 100%;
        text-align: center;
        font-size: 25px;
        font-weight: bold;
        color: #fff;
        z-index: -1;
        transform: rotate(calc(var(--i) * 30deg));
      }

      .number span {
        display: inline-block;
        padding-top: 10px;
        transform: rotate(calc(var(--i) * -30deg));
      }
    </style>

    <script>
      const secondHand = document.querySelector('.second-hand');
      const minuteHand = document.querySelector('.min-hand');
      const hourHand = document.querySelector('.hour-hand');
      function setDate() {
        const now = new Date();
        const seconds = now.getSeconds();
        // Add 90deg offset to compensate for the default horizontal CSS rotation
        const secondsDegrees = (seconds / 60) * 360 + 90;
        // Temporarily disable transition at 0s to prevent the hand from spinning backwards 360deg
        if (seconds === 0) {
          secondHand.style.transition = 'none';
        } else {
          secondHand.style.transition = ''; // Restore CSS-defined transition
        }
        secondHand.style.transform = `rotate(${secondsDegrees}deg)`;
        const minutes = now.getMinutes();
        const minutesDegrees = (minutes / 60) * 360 + 90;
        minuteHand.style.transform = `rotate(${minutesDegrees}deg)`;
        const hours = now.getHours();
        const hoursDegrees = (hours / 12) * 360 + 90;
        hourHand.style.transform = `rotate(${hoursDegrees}deg)`;
      }
      setInterval(setDate, 1000);

      setDate();
    </script>
  </body>
</html>
