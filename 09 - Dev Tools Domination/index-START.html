<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Console Tricks!</title>
    <link rel="icon" href="https://fav.farm/🔥" />
  </head>
  <body>
    <p onClick="makeGreen()">×BREAK×DOWN×</p>

    <script>
      const dogs = [
        { name: 'Snickers', age: 2 },
        { name: 'hugo', age: 8 },
      ];

      function makeGreen() {
        const p = document.querySelector('p');
        p.style.color = '#BADA55';
        p.style.fontSize = '50px';
      }

      // Regular
      console.log('hello');
      // Interpolated
      console.log('Hello %s', '🌐');
      // Styled
      console.log('%c hello world', 'color:red');
      // warning!
      console.warn('oh no');
      // Error :|
      console.error('oops');
      // Info
      console.info('wow');
      // Testing
      console.assert(1 === 2, 'not correct');
      // clearing
      // console.clear()
      // Viewing DOM Elements
      const p = document.querySelector('p');
      console.log(p);
      console.dir(p);
      // Grouping together
      dogs.forEach(dog => {
        console.group(`${dog.name}`);
        console.groupCollapsed(`${dog.name}`);
        console.log(`This is ${dog.name}`);
        console.log(`${dog.name} is ${dog.age} years old`);
        console.log(`${dog.name} is ${dog.age * 7} dog years old`);
        console.groupEnd(`${dog.name}`);
      });
      // counting

      console.count('Jan');
      console.count('Jan');
      console.count('Jan');
      console.count('Jan');
      console.count('Jan');
      // timing
      console.time('fetching data');
      fetch('https://api.github.com/users/janf1997-sys').then(data =>
        data.json().then(data => {
          console.timeEnd('fetching data');
          console.log(data);
        }),
      );
      console.table(dogs);
    </script>
  </body>
</html>
