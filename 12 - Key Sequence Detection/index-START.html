<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Key Detection</title>
    <script type="text/javascript" src="./cornify.js"></script>
    <link rel="icon" href="https://fav.farm/🔥" />
  </head>
  <body>
    <script>
      // Buffer array to store recent keystrokes
      const pressed = [];
      const secretCode = 'abongo';
      window.addEventListener('keyup', e => {
        pressed.push(e.key);
        pressed.splice(
          // Limit array size to the exact length of secretCode
          // Start index counts backwards from the end (-secretCode.length - 1)
          // Delete count removes the excess characters from the front

          -secretCode.length - 1,
          pressed.length - secretCode.length,
        );
        // Join keys into a single string and check for full secretCode match
        if (pressed.join('').includes(secretCode)) {
          cornify_add();
        }
      });
    </script>
  </body>
</html>
