<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Speech Synthesis</title>
    <link
      href="https://fonts.googleapis.com/css?family=Pacifico"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="https://fav.farm/🔥" />
  </head>
  <body>
    <div class="voiceinator">
      <h1>The Voiceinator 5000</h1>

      <select name="voice" id="voices">
        <option value="">Select A Voice</option>
      </select>

      <label for="rate">Rate:</label>
      <input name="rate" type="range" min="0" max="3" value="1" step="0.1" />

      <label for="pitch">Pitch:</label>

      <input name="pitch" type="range" min="0" max="2" step="0.1" />
      <textarea name="text">Hello! I love JavaScript 👍</textarea>
      <button id="stop">Stop!</button>
      <button id="speak">Speak</button>
    </div>

    <script>
      const msg = new SpeechSynthesisUtterance();
      let voices = [];
      const voicesDropdown = document.querySelector('[name="voice"]');
      const options = document.querySelectorAll(
        '[type="range"], [name="text"]',
      );
      const speakButton = document.querySelector('#speak');
      const stopButton = document.querySelector('#stop');
      msg.text = document.querySelector('[name="text"]').value;

      function populateVoices() {
        // get OS-native and browser-provided TTS voices
        voices = this.getVoices();
        voicesDropdown.innerHTML = voices
          // Map voice models into option elements for user selection
          .map(
            voice =>
              `<option value="${voice.name}">${voice.name} (${voice.lang})</option>`,
          )
          .join('');
        voicesDropdown.innerHTML;
      }

      function setVoice() {
        // Find matching voice object by unique name and attach it to utterance
        msg.voice = voices.find(voice => voice.name === this.value);
        toggle();
      }
      // Restarts playback by default, or cancels completely if passed false
      function toggle(startOver = true) {
        // Clear playback queue to stop any active or pending speech immediately
        speechSynthesis.cancel();

        if (startOver) {
          speechSynthesis.speak(msg);
        }
      }

      function setOption() {
        // Dynamically update corresponding utterance properties
        msg[this.name] = this.value;
        toggle();
      }

      speechSynthesis.addEventListener('voiceschanged', populateVoices);
      voicesDropdown.addEventListener('change', setVoice);
      options.forEach(option => option.addEventListener('change', setOption));
      speakButton.addEventListener('click', toggle);
      stopButton.addEventListener('click', () => toggle(false));
    </script>
  </body>
</html>
