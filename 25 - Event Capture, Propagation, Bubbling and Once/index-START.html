<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Understanding JavaScript's Capture</title>
    <link rel="icon" href="https://fav.farm/🔥" />
  </head>
  <body class="bod">
    <div class="one">
      <div class="two">
        <div class="three"></div>
      </div>
    </div>

    <style>
      html {
        box-sizing: border-box;
      }

      *,
      *:before,
      *:after {
        box-sizing: inherit;
      }

      div {
        width: 100%;
        padding: 100px;
      }

      .one {
        background: thistle;
      }

      .two {
        background: mistyrose;
      }

      .three {
        background: coral;
      }
    </style>

    <script>
      const divs = document.querySelectorAll('div');

      function logText(e) {
        // stopPropagation stops after first log
        // e.stopPropagation();
        console.log(this.classList.value);
      }

      divs.forEach(div =>
        div.addEventListener('click', logText, {
          capture: false, // capture: false runs bottom to top, capture: true runs top to bottom
          once: true, // Removes EventListener after first run
        }),
      );
    </script>
  </body>
</html>
